[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  "node_modules",
  "events_backend/.venv",
  "events_backend/venv",
  "events_backend/env",
  "events_backend/.venv/**",
  "events_backend/**/.venv/**",
  "*/site-packages/*"
]
per-file-ignores = [
  # allow __init__ packages to have unused imports for re-export
  "*/__init__.py: F401"
]
